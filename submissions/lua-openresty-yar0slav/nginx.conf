# The whole server. start.sh fills in __LISTEN__ (HOST:PORT), __ROOT__ (this folder) and __WORKERS__ (cores).
worker_processes __WORKERS__;     # one event loop per core
worker_rlimit_nofile 200000;      # the service's LimitNOFILE: every keep-alive client holds one fd
daemon off;
pid nginx.pid;
error_log stderr warn;
pcre_jit on;

env DATABASE_URL;
env JWT_SECRET;
env DB_POOL_SIZE;
env PG_PREPARE;
env PG_PLAN_CACHE_MODE;
env PG_BUFFERED;

# bcrypt (~60 ms of CPU per hash) runs here, off the event loop, so a login never stalls a worker's connections
thread_pool bcrypt threads=2 max_queue=65536;

events {
    worker_connections 65535;
}

http {
    access_log off;
    server_tokens off;
    default_type application/json;

    keepalive_timeout 75s;        # clients think ~7 s between pages; behind Nginx needs >= 65 s
    keepalive_requests 1000000;
    reset_timedout_connection on;
    tcp_nodelay on;

    client_max_body_size 1m;
    client_body_buffer_size 1m;   # == max size, so request bodies always stay in memory
    client_body_temp_path client_body;
    proxy_temp_path proxy;
    fastcgi_temp_path fastcgi;
    uwsgi_temp_path uwsgi;
    scgi_temp_path scgi;

    lua_package_path "__ROOT__/lua/?.lua;__ROOT__/vendor/?.lua;__ROOT__/vendor/?/init.lua;;";
    lua_socket_log_errors off;

    init_by_lua_block { require "app" }
    init_worker_by_lua_block { require("app").init_worker() }

    server {
        listen __LISTEN__ backlog=65535 reuseport;

        location / {
            content_by_lua_block { require("app").handle() }
        }
    }
}
