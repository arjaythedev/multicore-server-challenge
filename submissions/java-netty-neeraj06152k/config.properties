# Conduit RealWorld High-Performance Server Configuration
# Modifications here do NOT require recompilation.

# Server & Network Configuration
server.host=0.0.0.0
server.port=3000
server.so_backlog=65535
server.tcp_nodelay=true
server.so_keepalive=true
server.so_reuseport=true
server.http.max_initial_line_length=4096
server.http.max_header_size=8192
server.http.max_chunk_size=8192
server.http.max_content_length=65536

# Database & Connection Pool Configuration
db.url=postgres://conduit:conduit@127.0.0.1:5432/conduit
db.pool.max_size=90
db.pipelining_limit=64
db.cache_prepared_statements=true

# Security Configuration
security.jwt.secret=multicore-server-challenge
security.jwt.expiration_days=30
security.bcrypt.cost=10

# Concurrency Tuning according to Amdahl's Law (Leave 4-5 cores for PostgreSQL 18)
concurrency.netty.worker_threads=4
concurrency.bcrypt.worker_threads=2
concurrency.bcrypt.ring_buffer_size=2048
