[package]
name = "conduit"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mio = { version = "1.2.4", features = ["os-poll", "net"] }
socket2 = { version = "0.6.5", features = ["all"] }
httparse = "1.10.1"
postgres-protocol = "0.6.12"
fallible-iterator = "0.2"
bytes = "1.12.1"
ring = "0.17.14"
base64 = "0.22.1"
serde_json = "1.0.154"
bcrypt = "0.19.3"
mimalloc = { version = "0.1.52", default-features = false }
libc = "0.2.190"
form_urlencoded = "1.2.2"
itoa = "1.0.18"

[profile.release]
lto = "fat"
codegen-units = 1
debug = false
