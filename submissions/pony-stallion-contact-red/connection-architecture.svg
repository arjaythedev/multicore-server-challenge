<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">Client connections and database workers</title>
<desc id="desc">A listener accepts client connections, each represented by a separate connection actor. Four example actors send work to two database workers. Each database worker maintains multiple connections to PostgreSQL.</desc>
<defs>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>
 text {font-family:Inter,Arial,Helvetica,sans-serif;fill:#172b45}
 .heading {font-size:16px;font-weight:700;letter-spacing:2px;fill:#64748b}
 .label {font-size:23px;font-weight:600}
 .note {font-size:16px;fill:#64748b}
 .flow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
 .db-link {fill:none;stroke:#15847e;stroke-width:2.8;stroke-linecap:round}
 </style>
</defs>
<rect width="1440" height="800" fill="white"/>
<text x="64" y="74" font-size="32" font-weight="700">Client connections and database workers</text>
<text x="64" y="111" class="note">One actor per client connection · Multiple database connections per worker</text>
<g text-anchor="middle" class="heading">
 <text x="165" y="200">LISTENER</text>
 <text x="520" y="200">CONNECTION ACTORS</text>
 <text x="910" y="200">DATABASE WORKERS</text>
 <text x="910" y="226" class="note" style="font-weight:400;letter-spacing:0">(one per CPU)</text>
 <text x="1260" y="200">DATABASE</text>
</g>
<!-- Listener-to-actor links. -->
<g class="flow">
 <path d="M265 425 C335 425 325 285 400 285"/>
 <path d="M265 425 C325 425 340 385 400 385"/>
 <path d="M265 425 C325 425 340 485 400 485"/>
 <path d="M265 425 C335 425 325 585 400 585"/>
</g>
<!-- Actor-to-worker messages, with a white halo to separate crossings. -->
<g fill="none" stroke="white" stroke-width="9">
 <path d="M640 285 C705 285 720 310 785 310"/>
 <path d="M640 485 C708 485 722 365 785 365"/>
 <path d="M640 385 C705 385 722 525 785 525"/>
 <path d="M640 585 C705 585 720 580 785 580"/>
</g>
<g class="flow">
 <path d="M640 285 C705 285 720 310 785 310"/>
 <path d="M640 485 C708 485 722 365 785 365"/>
</g>
<path d="M640 385 C705 385 722 525 785 525" fill="none" stroke="white" stroke-width="9"/>
<g class="flow">
 <path d="M640 385 C705 385 722 525 785 525"/>
 <path d="M640 585 C705 585 720 580 785 580"/>
</g>
<!-- Separate, editable paths for each database connection. -->
<g class="db-link">
 <path d="M1035 290 C1095 290 1105 310 1160 310"/>
 <path d="M1035 320 C1095 320 1105 340 1160 340"/>
 <path d="M1035 350 C1095 350 1105 370 1160 370"/>
 <path d="M1035 380 C1095 380 1105 400 1160 400"/>
 <path d="M1035 505 C1095 505 1105 490 1160 490"/>
 <path d="M1035 535 C1095 535 1105 520 1160 520"/>
 <path d="M1035 565 C1095 565 1105 550 1160 550"/>
 <path d="M1035 595 C1095 595 1105 580 1160 580"/>
</g>
<!-- Listener. -->
<g id="listener">
 <rect x="65" y="385" width="200" height="80" rx="16" fill="#edf2f7" stroke="#64748b" stroke-width="2"/>
 <text x="165" y="434" class="label" text-anchor="middle">Listener</text>
</g>
<!-- Client connection actors. -->
<g id="connection-actors" text-anchor="middle">
 <g id="connection-1"><rect x="400" y="250" width="240" height="70" rx="13" fill="#eff6ff" stroke="#3b79bd" stroke-width="2"/><text x="520" y="293" class="label">Connection 1</text></g>
 <g id="connection-2"><rect x="400" y="350" width="240" height="70" rx="13" fill="#eff6ff" stroke="#3b79bd" stroke-width="2"/><text x="520" y="393" class="label">Connection 2</text></g>
 <g id="connection-3"><rect x="400" y="450" width="240" height="70" rx="13" fill="#eff6ff" stroke="#3b79bd" stroke-width="2"/><text x="520" y="493" class="label">Connection 3</text></g>
 <g id="connection-4"><rect x="400" y="550" width="240" height="70" rx="13" fill="#eff6ff" stroke="#3b79bd" stroke-width="2"/><text x="520" y="593" class="label">Connection 4</text></g>
 <g fill="#3b79bd"><circle cx="520" cy="646" r="3"/><circle cx="520" cy="660" r="3"/><circle cx="520" cy="674" r="3"/></g>
 <text x="520" y="711" class="note">One per client connection</text>
</g>
<!-- Workers; no individual connection boxes. -->
<g id="database-workers" text-anchor="middle">
 <g id="worker-1"><rect x="785" y="255" width="250" height="160" rx="16" fill="#effaf8" stroke="#15847e" stroke-width="2"/><text x="910" y="326" class="label">Database</text><text x="910" y="358" class="label">Worker 1</text></g>
 <g id="worker-2"><rect x="785" y="470" width="250" height="160" rx="16" fill="#effaf8" stroke="#15847e" stroke-width="2"/><text x="910" y="541" class="label">Database</text><text x="910" y="573" class="label">Worker 2</text></g>
</g>
<!-- Shared database. -->
<g id="postgresql">
 <path d="M1160 292 C1160 255 1360 255 1360 292 V603 C1360 640 1160 640 1160 603 Z" fill="#f1f5f9" stroke="#476582" stroke-width="2"/>
 <ellipse cx="1260" cy="292" rx="100" ry="28" fill="#e4edf5" stroke="#476582" stroke-width="2"/>
 <text x="1260" y="457" class="label" text-anchor="middle">PostgreSQL</text>
</g>
<g id="concurrent-connections-annotation">
 <ellipse cx="1097" cy="445" rx="58" ry="182" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 6"/>
 <path d="M1097 627 V675" fill="none" stroke="#b45309" stroke-width="2"/>
 <text x="1097" y="707" text-anchor="middle" font-size="20" font-weight="600" style="fill:#92400e">95 Concurrent Connections</text>
</g>
</svg>
