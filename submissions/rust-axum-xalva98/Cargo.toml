[package]
name = "conduit"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["json", "macros"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime", "with-time-0_3"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
bcrypt = "0.19.1"
time = "0.3.47"
thiserror = "2.0.18"
anyhow = "1.0.102"
uuid = { version = "1.23.1", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
form_urlencoded = "1.2.2"
mimalloc = { version = "0.1.52", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
