[package]
name = "conduit"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
# No TLS: Postgres is on localhost.
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
postgres-types = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde_json = "=1.0.154"
bcrypt = "=0.19.3"
hmac = "=0.12.1"
sha2 = "=0.10.9"
base64 = "=0.22.1"
itoa = "=1.0.18"
form_urlencoded = "=1.2.2"
percent-encoding = "=2.3.2"
socket2 = { version = "=0.6.5", features = ["all"] }
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
