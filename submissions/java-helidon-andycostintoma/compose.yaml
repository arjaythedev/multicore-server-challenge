services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit
    ports:
      - "127.0.0.1:${CONDUIT_PG_PORT:-5432}:5432"
    volumes:
      - data:/var/lib/postgresql
      - ../../schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  data:
