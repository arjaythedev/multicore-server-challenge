services:
  app:
    image: eclipse-temurin:25.0.5_8-jdk-noble
    entrypoint: ["/opt/conduit/bin/conduit"]
    working_dir: /opt/conduit
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgres://conduit:conduit@db:5432/conduit_dev
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JAVA_OPTS: ${JAVA_OPTS:-}
    volumes:
      - type: bind
        source: ${HERE:?HERE is required}/build/install/conduit
        target: /opt/conduit
        read_only: true
      - type: bind
        source: ${WORK:?WORK is required}
        target: ${WORK:?WORK is required}
    networks: [benchmark]

  db:
    image: postgres:18.6-bookworm
    command: ["postgres", "-c", "fsync=on"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: conformance-admin
      POSTGRES_DB: conduit_dev
    volumes:
      - data:/var/lib/postgresql
      - type: bind
        source: ${WORK:?WORK is required}
        target: /work
        read_only: true
    networks: [benchmark]

  loadgen:
    image: golang:1.27.1-bookworm
    entrypoint: ["${WORK:?WORK is required}/loadgen"]
    working_dir: ${WORK:?WORK is required}
    init: true
    volumes:
      - type: bind
        source: ${WORK:?WORK is required}
        target: ${WORK:?WORK is required}
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
    networks: [benchmark]

networks:
  benchmark:
    internal: true

volumes:
  data:
