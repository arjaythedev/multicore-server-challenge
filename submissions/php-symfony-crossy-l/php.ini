; PHP settings for the server. start.sh points PHPRC at this folder, so this is the only php.ini the server
; reads. Command-line tools (composer, the test and analysis tools) run on PHP's defaults.

; The server is Swoole's, loaded here and nowhere else.
extension = swoole

[PHP]
expose_php = 0
default_charset = "UTF-8"
; Responses name their own Content-Type; PHP would add text/html to one that has none.
default_mimetype = ""
date.timezone = UTC

; The configuration (DATABASE_URL, JWT_SECRET) arrives in the environment and is read from $_SERVER and $_ENV.
variables_order = "EGPCS"

; No execution timer.
max_execution_time = 0
; Per worker. Swoole gives every open connection a 64 KB receive buffer from this heap, so a worker holding 10,000
; connections counts about 700 MB here, though little of it is ever written to.
memory_limit = 2G

; Errors go to the server's stderr; nothing is sent to the client.
error_reporting = E_ALL
display_errors = 0
log_errors = 1
html_errors = 0

zend.assertions = -1
zend.enable_gc = 1
serialize_precision = -1

; The files never change under a running server.
realpath_cache_size = 4096K
realpath_cache_ttl = 3600

[opcache]
opcache.enable = 1
; The server runs under the command-line SAPI.
opcache.enable_cli = 1
; Files are not checked for changes. A new deploy is a new process.
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; The tracing JIT compiles the hot paths.
opcache.jit = tracing
opcache.jit_buffer_size = 128M
