[package]
name = "conduit"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
ring = "0.17"
bcrypt = "0.19.3"
crossbeam-channel = "0.5"
serde_json = "1"
httparse = "1"
base64 = "0.23.1"
memchr = "2"
io-uring = "0.7.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
