# The whole HTTP surface. start.sh fills in __WORKERS__, __THREADS__, __LISTEN__ and __ROOT__.
# "sql METHOD a.sql,b.sql name=value ..." runs those files from sql/ in order and answers with what they return
# (module/ngx_http_sql_module.c). Every value is named here; nothing reaches SQL that isn't listed.
worker_processes __WORKERS__;
worker_rlimit_nofile 200000;
daemon off;
error_log stderr warn;
pid __ROOT__/run/nginx.pid;
env DATABASE_URL;
env PGSSLMODE;                       # libpq: start.sh sets it (disable: Postgres is on the same box)
thread_pool sql threads=__THREADS__ max_queue=65536;   # one Postgres connection per thread

events {
    worker_connections 65536;
    multi_accept on;
}

http {
    access_log off;
    server_tokens off;
    default_type application/json;
    keepalive_timeout 75s;
    keepalive_requests 1000000;
    client_body_temp_path __ROOT__/run/client_body;
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    client_body_in_single_buffer on;      # so $request_body holds the whole body
    sql_dir __ROOT__/sql;
    sql_batch_max __BATCH_MAX__;              # requests per batch statement
    sql_batch_inflight __BATCH_INFLIGHT__;    # batches of one route in flight per worker
    sql_batch_wait __BATCH_WAIT__;            # how long a queue's first request waits for others

    server {
        listen __LISTEN__ reuseport backlog=65535;

        error_page 400 @e400;
        error_page 405 @e405;
        error_page 413 @e413;
        error_page 500 502 503 504 @e500;
        location @e400 { return 400 '{"errors":{"body":["bad request"]}}'; }
        location @e405 { return 405 '{"errors":{"body":["method not allowed"]}}'; }
        location @e413 { return 413 '{"errors":{"body":["request body too large"]}}'; }
        location @e500 { return 500 '{"errors":{"body":["internal server error"]}}'; }

        location = /api/users {
            sql POST register_check.sql,register_insert.sql,jwt_sign.sql,user_out.sql
                req=$request_body hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD ok_status=201;
        }
        location = /api/users/login {
            sql POST login.sql,jwt_sign.sql,user_out.sql
                req=$request_body hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD ok_status=200;
        }
        location = /api/user {
            sql GET user_get.sql
                authorization=$http_authorization hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD required=1;
            sql_batch GET user_get_batch.sql;
            sql PUT auth.sql,user_update_check.sql,user_update.sql
                authorization=$http_authorization hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD required=1 req=$request_body;
        }

        location ~ ^/api/profiles/(?<username>[^/]+)$ {
            sql GET profile_get.sql
                authorization=$http_authorization hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD username=$username;
            sql_batch GET profile_get_batch.sql;
        }
        location ~ ^/api/profiles/(?<username>[^/]+)/follow$ {
            sql POST auth.sql,profile_follow.sql
                authorization=$http_authorization hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD required=1 username=$username;
            sql DELETE auth.sql,profile_unfollow.sql
                authorization=$http_authorization hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD required=1 username=$username;
        }

        location = /api/articles {
            sql GET articles_list.sql
                authorization=$http_authorization hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD
                limit=@$arg_limit offset=@$arg_offset tag=@$arg_tag author=@$arg_author favorited=@$arg_favorited;
            sql_batch GET articles_list_batch.sql;
            sql POST auth.sql,article_create_check.sql,begin.sql,article_insert.sql,tags_insert.sql,article_tags_insert.sql,commit.sql,article_out.sql
                authorization=$http_authorization hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD required=1 req=$request_body ok_status=201;
        }
        location = /api/articles/feed {
            sql GET articles_feed.sql
                authorization=$http_authorization hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD required=1
                limit=@$arg_limit offset=@$arg_offset;
            sql_batch GET articles_feed_batch.sql;
        }
        location ~ ^/api/articles/(?<slug>[^/]+)$ {
            sql GET article_get.sql
                authorization=$http_authorization hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD slug=$slug;
            sql_batch GET article_get_batch.sql;
            sql PUT auth.sql,article_update_check.sql,article_update.sql,article_out.sql
                authorization=$http_authorization hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD required=1 slug=$slug req=$request_body ok_status=200;
            sql DELETE auth.sql,article_delete.sql
                authorization=$http_authorization hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD required=1 slug=$slug;
        }
        location ~ ^/api/articles/(?<slug>[^/]+)/favorite$ {
            sql POST auth.sql,favorite.sql,article_out.sql
                authorization=$http_authorization hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD required=1 slug=$slug ok_status=200;
            sql DELETE auth.sql,unfavorite.sql,article_out.sql
                authorization=$http_authorization hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD required=1 slug=$slug ok_status=200;
        }
        location ~ ^/api/articles/(?<slug>[^/]+)/comments$ {
            sql GET comments_list.sql
                authorization=$http_authorization hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD slug=$slug;
            sql_batch GET comments_list_batch.sql;
            sql POST auth.sql,comment_check.sql,comment_create.sql
                authorization=$http_authorization hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD required=1 slug=$slug req=$request_body;
        }
        location ~ ^/api/articles/(?<slug>[^/]+)/comments/(?<comment_id>[^/]+)$ {
            sql DELETE auth.sql,comment_delete.sql
                authorization=$http_authorization hmac_ipad=env:JWT_HMAC_IPAD hmac_opad=env:JWT_HMAC_OPAD required=1 slug=$slug comment_id=$comment_id;
        }

        location = /api/tags {
            sql GET tags.sql;
            sql_batch GET tags_batch.sql;
        }

        location / {
            return 404 '{"errors":{"body":["not found"]}}';
        }
    }
}
