services:
  multicore-server-challenge:
    image: postgres:18
    container_name: multicore-server-challenge
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD}
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d/
      - multicore-server-challenge-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 12s
      timeout: 6s
      retries: 6
    networks:
      - docker0
    restart: never # always | unless-stopped | never

volumes:
  multicore-server-challenge-volume:

networks:
  docker0:
    external: true
